# Debugging loop. Trigger: the CI workflow failed.
#  - on main: the agent diagnoses the failure (step, first error, repro, suspected commit) and files
#    ONE issue labeled ci-failure + needs-triage. It does not fix code here.
#  - on an agent PR branch: deterministic hand-off, the PR is labeled needs-rework (rework reads the logs).
name: "factory: CI doctor"

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  diagnose-main:
    if: >-
      vars.FACTORY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: factory-ci-doctor-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 30
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app.outputs.token }}
          allowed_bots: ${{ vars.FACTORY_BOT_LOGIN }}
          prompt: "/ci-doctor ${{ github.event.workflow_run.id }}"
          claude_args: >-
            --max-turns 40
            --max-budget-usd 3
            ${{ vars.FACTORY_MODEL && format('--model {0}', vars.FACTORY_MODEL) || '' }}
            --allowedTools "Read,Grep,Glob,Bash(npm ci),Bash(npm run *),Bash(npx vitest *),Bash(node *),Bash(git log *),Bash(git show *),Bash(git diff *),Bash(git bisect *),Bash(gh run view *),Bash(gh issue list *),Bash(gh issue create *)"

  flag-agent-pr:
    if: >-
      vars.FACTORY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'failure' &&
      startsWith(github.event.workflow_run.head_branch, 'agent/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - name: Send the PR back to rework
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then echo "No open PR for $BRANCH"; exit 0; fi
          gh pr comment "$pr" --body "<!-- factory:ci-failed --> CI failed on this branch: $RUN_URL"
          gh pr edit "$pr" --add-label needs-rework --remove-label review:passed
