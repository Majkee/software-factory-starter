# Task: rework. Trigger: PR labeled needs-rework (by review or the CI doctor).
# Fixes only what was reported. After FACTORY_MAX_REWORK attempts the PR goes to a human.
name: "factory: rework"

on:
  pull_request:
    types: [labeled]

permissions: {}

jobs:
  rework:
    if: >-
      vars.FACTORY_ENABLED == 'true' &&
      github.event.label.name == 'needs-rework' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'agent')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: factory-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
      - name: Attempt limit (deterministic)
        id: limit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          MAX: ${{ vars.FACTORY_MAX_REWORK || '2' }}
        run: |
          n=${{ github.event.pull_request.number }}
          done=$(gh pr view "$n" --json comments --jq '[.comments[].body | select(startswith("<!-- factory:rework"))] | length')
          echo "Rework attempts so far: $done (max $MAX)"
          if [ "$done" -ge "$MAX" ]; then
            gh pr comment "$n" --body "<!-- factory:stuck --> $done rework attempts did not get this PR through review/CI. Handing it to a human."
            gh pr edit "$n" --remove-label needs-rework --add-label ready-for-human
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.limit.outputs.go == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - if: steps.limit.outputs.go == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: steps.limit.outputs.go == 'true'
        run: npm ci
      - if: steps.limit.outputs.go == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          allowed_bots: ${{ vars.FACTORY_BOT_LOGIN }}
          prompt: "/rework ${{ github.event.pull_request.number }}"
          claude_args: >-
            --max-turns 40
            --max-budget-usd 3
            ${{ vars.FACTORY_MODEL && format('--model {0}', vars.FACTORY_MODEL) || '' }}
            --allowedTools "Read,Edit,Write,Grep,Glob,Bash(npm ci),Bash(npm run *),Bash(npx vitest *),Bash(node *),Bash(git *),Bash(gh pr view *),Bash(gh pr checks *),Bash(gh pr checkout *),Bash(gh pr comment *),Bash(gh pr edit *),Bash(gh run view *),Bash(gh issue view *)"
